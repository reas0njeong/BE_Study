name: Fly Deploy

on:
  push:
    branches: [ yujung2 ]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (선택) JDK가 꼭 필요하진 않지만 로그에 버전 찍히게만 둠
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ FlyV1 fm2_,fm2_lJPEThuRLK9USqFqwdLYVOWlQeXn6CapFroW90EHMC74n5LwzosOLJj2T3CScvhNXh8JtGBihvl4/Cn+JiWYPfnlktUbgOlevC0NfP48ueAbeMQQ76OA6OETqB0EgF+mrx0na8O5aHR0cHM6Ly9hcGkuZmx5LmlvL2FhYS92MZgEks5oynJGzo5ieGQXzgASpXoKkc4AEqV6DMQQJVd9SKu+yvEmX9KlyTvic8QgjU6JBXow1SPIL8KmsCCDbatQInDCOoXOAlrl4yZUC80= }}
        run: |
          flyctl deploy --app be-study --remote-only --detach
